<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Berke Göktuğ Sarılı</title>
  <link rel="icon" href="/favicon.svg" />
  <script>
    (function () {
      var s = localStorage.getItem("theme");
      var t = s || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <style>
    :root { --bg: #f7f9fb; --card: #fff; --text: #16212e; --soft: #51606f; --accent: #059669; --border: #e3e8ef; }
    :root[data-theme="dark"] { --bg: #0b1220; --card: #131e33; --text: #e6edf5; --soft: #9fb0c3; --accent: #34d399; --border: #1f2d47; }
    * { margin: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px;
    }
    .box { max-width: 460px; }
    .code { font-size: 5rem; font-weight: 800; letter-spacing: -0.04em; color: var(--accent); line-height: 1; }
    h1 { font-size: 1.5rem; margin: 12px 0 8px; letter-spacing: -0.02em; }
    p { color: var(--soft); margin-bottom: 24px; }
    a.home {
      display: inline-block; background: var(--accent); color: #fff; font-weight: 600;
      padding: 12px 24px; border-radius: 12px; text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <a class="home" href="/">← Back to home</a>
  </div>
</body>
</html>
